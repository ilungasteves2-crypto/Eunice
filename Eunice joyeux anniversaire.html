<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Joyeux Anniversaire · EUNICE LUSIMANA · Édition Prestige</title>
    <!-- Google Fonts : élégance sobre -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Fond blanc pur avec très légère texture dorée subtile */
        body {
            min-height: 100vh;
            background: #ffffff;
            background-image: radial-gradient(circle at 10% 30%, rgba(255,245,220,0.3) 1.5%, transparent 2%);
            background-size: 48px 48px;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Bougies allumées (de chaque côté) */
        .candle-left, .candle-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 70px;
            height: 160px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(200,100,20,0.4));
        }
        .candle-left { left: 20px; }
        .candle-right { right: 20px; }
        .candle-body {
            width: 32px;
            height: 115px;
            background: linear-gradient(145deg, #f7e5c2, #e8cfa0);
            border-radius: 16px 16px 8px 8px;
            margin: 0 auto;
            box-shadow: 0 10px 15px rgba(0,0,0,0.08);
            position: relative;
        }
        .wick {
            width: 4px;
            height: 12px;
            background: #4a3724;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .flame {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 34px;
            background: radial-gradient(circle, #ffdd88, #ff8822);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 18px #ffaa44;
            animation: flicker 0.28s infinite alternate ease-in-out;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.95; box-shadow: 0 0 8px #ffaa44; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; box-shadow: 0 0 24px #ffcc66; }
        }
        @media (max-width: 700px) {
            .candle-left, .candle-right { transform: translateY(-50%) scale(0.7); }
            .candle-left { left: -5px; }
            .candle-right { right: -5px; }
        }
        @media (max-width: 550px) {
            .candle-left, .candle-right { display: none; }
        }

        /* Carte principale : fond blanc satiné, élégant */
        .birthday-card {
            position: relative;
            z-index: 15;
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 250, 0.98);
            border-radius: 56px;
            border: 1px solid rgba(210, 180, 140, 0.4);
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(0, 0, 0, 0.03);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: transform 0.2s ease;
        }

        /* Titre Joyeux Anniversaire : ROUGE PROFOND (bordeaux élégant) */
        .happy-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 7vw, 3.8rem);
            font-weight: 800;
            color: #9b2c1d; /* Rouge profond, très lisible */
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            text-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        /* Nom : BLEU TRÈS FONCÉ (nuit élégante) */
        .celebrated-name {
            font-size: clamp(2.2rem, 9vw, 4.8rem);
            font-weight: 900;
            font-family: 'Playfair Display', serif;
            color: #0a1c3a; /* Bleu très foncé, intense et chic */
            margin: 0.5rem 0 0.75rem;
            letter-spacing: 1.5px;
            display: inline-block;
            animation: floatingName 3s infinite ease-in-out;
            text-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        @keyframes floatingName {
            0% { transform: translateY(0px);}
            50% { transform: translateY(-5px);}
            100% { transform: translateY(0px);}
        }

        .message {
            font-size: 1rem;
            font-weight: 500;
            color: #4a3b2c;
            background: #fef8ef;
            display: inline-block;
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            margin: 1rem auto 1.2rem;
            border-left: 3px solid #c0813a;
            border-right: 3px solid #c0813a;
            font-family: 'Poppins', sans-serif;
        }

        .decoration-line {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c0813a, #d4994c, #c0813a, transparent);
            margin: 0.8rem auto;
        }

        .confetti-button {
            background: linear-gradient(115deg, #9b2c1d, #7a2418);
            border: none;
            border-radius: 60px;
            padding: 14px 36px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff5ea;
            cursor: pointer;
            margin-top: 0.8rem;
            margin-bottom: 0.8rem;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            transition: all 0.25s ease;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,200,130,0.5);
        }

        .confetti-button:hover {
            transform: scale(1.02);
            background: linear-gradient(115deg, #b53a28, #8e2a1c);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            color: #ffffff;
        }

        .hint {
            font-size: 0.7rem;
            color: #b68b54;
            margin-top: 0.6rem;
            font-weight: 400;
        }

        /* Footer développeur discret mais lisible */
        .developer-footer {
            position: fixed;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Poppins', monospace;
            font-size: 0.8rem;
            color: #9b7b5a;
            background: rgba(255,250,235,0.9);
            backdrop-filter: blur(6px);
            padding: 5px 14px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 40px;
            z-index: 99;
            font-weight: 500;
            letter-spacing: 0.3px;
            pointer-events: none;
            border: 1px solid #eeddbb;
        }

        /* Ballons flottants (décor aérien) */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -120px;
            transition: bottom linear;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.08));
            animation: swayBalloon 2.4s infinite alternate ease-in-out;
        }

        .balloon-body {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.1);
        }

        .balloon-body::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 11px;
            background: #8b6946;
            border-radius: 2px;
        }

        .balloon-string {
            position: absolute;
            bottom: -28px;
            left: 50%;
            width: 1.5px;
            height: 28px;
            background: #b87c48;
            transform: translateX(-50%);
        }

        @keyframes swayBalloon {
            0% { transform: rotate(-2.5deg); }
            100% { transform: rotate(2.5deg); }
        }

        /* Effets visuels (flashs, particules) harmonisés */
        .color-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            animation: flashFade 0.6s ease-out forwards;
        }

        @keyframes flashFade {
            0% { opacity: 0.6; }
            100% { opacity: 0; visibility: hidden; }
        }

        .color-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 90;
            animation: particleFloat 1.1s ease-out forwards;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) scale(1); opacity: 0.9; }
            100% { transform: translateY(-150px) scale(0); opacity: 0; }
        }

        /* Étoiles scintillantes discrètes */
        .star {
            position: fixed;
            background: #ffdd99;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            animation: twinkleStar 3.5s infinite alternate;
        }

        @keyframes twinkleStar {
            0% { opacity: 0; transform: scale(0.5);}
            100% { opacity: 0.5; transform: scale(1);}
        }

        @media (max-width: 600px) {
            .birthday-card { padding: 1.5rem 1.2rem; border-radius: 40px; }
            .confetti-button { padding: 10px 22px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="balloon-container" id="balloonContainer"></div>

<!-- Bougies allumées (gauche et droite) -->
<div class="candle-left">
    <div class="candle-body">
        <div class="wick"></div>
        <div class="flame"></div>
    </div>
</div>
<div class="candle-right">
    <div class="candle-body">
        <div class="wick"></div>
        <div class="flame"></div>
    </div>
</div>

<div class="birthday-card">
    <div class="happy-title">🎈 Joyeux Anniversaire 🎂</div>
    <div class="celebrated-name">EUNICE LUSIMANA</div>
    <div class="decoration-line"></div>
    <div class="message">
        ✨ Que cette journée rayonne de joie et d'amour ✨<br>
        <i>Santé, bonheur, réussite infinie</i> 🌹
    </div>
    <button class="confetti-button" id="celebrateBtn">
        🎉 LANCER LA FÊTE & LA CHANSON 🎵
    </button>
    <div class="hint">
        💫 Cliquez pour la mélodie complète + voix qui chante, confettis, éclats lumineux et ballons 💫
    </div>
</div>

<div class="developer-footer">
    ✨ Développé par Steves Ilunga ✨
</div>

<script>
    (function() {
        // Confetti
        if (typeof confetti !== 'function') window.confetti = () => {};

        // --- Ballons aériens continus ---
        const container = document.getElementById('balloonContainer');
        const colorPalette = [
            "radial-gradient(circle at 30% 30%, #FFB7B2, #FF8A7A)",
            "radial-gradient(circle at 30% 30%, #FFD6A5, #F4A261)",
            "radial-gradient(circle at 30% 30%, #C9E4DE, #7F9C8B)",
            "radial-gradient(circle at 30% 30%, #FADADD, #E996A0)",
            "radial-gradient(circle at 30% 30%, #D9BF92, #B68B40)",
            "radial-gradient(circle at 30% 30%, #B0E0E6, #6FA8AB)",
            "radial-gradient(circle at 30% 30%, #E5D1FA, #B28BFF)",
            "radial-gradient(circle at 30% 30%, #FCE49B, #F5B041)"
        ];

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            const size = Math.floor(Math.random() * 48) + 42;
            balloon.style.width = `${size}px`;
            balloon.style.height = `${size}px`;
            const margin = 30;
            const maxLeft = window.innerWidth - size - margin;
            const leftPos = Math.random() * (maxLeft - margin) + margin;
            balloon.style.left = `${leftPos}px`;
            const duration = Math.random() * 12 + 7;
            balloon.style.transition = `bottom ${duration}s linear`;
            balloon.style.bottom = `-${size + 30}px`;
            const gradColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            const body = document.createElement('div');
            body.className = 'balloon-body';
            body.style.background = gradColor;
            const string = document.createElement('div');
            string.className = 'balloon-string';
            balloon.appendChild(body);
            balloon.appendChild(string);
            container.appendChild(balloon);
            setTimeout(() => { balloon.style.bottom = `-${size + 350}px`; }, 20);
            const removeIt = () => { if (balloon.parentNode) balloon.remove(); };
            balloon.addEventListener('transitionend', removeIt, { once: true });
            setTimeout(removeIt, duration * 1000 + 600);
        }

        function startAmbientBalloons() {
            for (let i = 0; i < 10; i++) setTimeout(() => createBalloon(), i * 150);
            setInterval(() => { if (document.querySelectorAll('.balloon').length < 25) createBalloon(); }, 1200);
        }

        // --- Audio : mélodie complète (instrumentale) ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playNote(freq, startTime, duration, volume, ctx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        // Mélodie complète "Joyeux Anniversaire" 4 phrases
        function playFullInstrumental(ctx, startDelay = 0.05) {
            const now = ctx.currentTime + startDelay;
            const tempo = 108;
            const beat = 60 / tempo;
            const p1 = [
                { f: 392.00, d: beat }, { f: 392.00, d: beat }, { f: 440.00, d: beat },
                { f: 392.00, d: beat }, { f: 523.25, d: beat }, { f: 493.88, d: beat * 1.6 }
            ];
            const p2 = [
                { f: 392.00, d: beat }, { f: 392.00, d: beat }, { f: 440.00, d: beat },
                { f: 392.00, d: beat }, { f: 587.33, d: beat }, { f: 523.25, d: beat * 1.6 }
            ];
            const p3 = [
                { f: 392.00, d: beat }, { f: 392.00, d: beat }, { f: 523.25, d: beat },
                { f: 493.88, d: beat }, { f: 440.00, d: beat }, { f: 523.25, d: beat * 0.8 }, { f: 493.88, d: beat * 0.7 }
            ];
            const p4 = [
                { f: 392.00, d: beat }, { f: 392.00, d: beat }, { f: 440.00, d: beat },
                { f: 392.00, d: beat }, { f: 523.25, d: beat * 1.2 }, { f: 493.88, d: beat * 0.8 }, { f: 523.25, d: beat * 1.9 }
            ];
            let cursor = now;
            p1.forEach(n => { playNote(n.f, cursor, n.d, 0.32, ctx); cursor += n.d; });
            cursor += 0.05;
            p2.forEach(n => { playNote(n.f, cursor, n.d, 0.32, ctx); cursor += n.d; });
            cursor += 0.05;
            p3.forEach(n => { playNote(n.f, cursor, n.d, 0.32, ctx); cursor += n.d; });
            cursor += 0.05;
            p4.forEach(n => { playNote(n.f, cursor, n.d, 0.34, ctx); cursor += n.d; });
        }

        // --- VOIX QUI CHANTE LES PAROLES COMPLÈTES (jusqu'à la fin) ---
        function singCompleteBirthdaySong() {
            const synth = window.speechSynthesis;
            if (!synth) return;
            let selectedVoice = null;
            const setVoice = () => {
                const voices = synth.getVoices();
                selectedVoice = voices.find(v => v.lang === 'fr-FR' && v.name.includes('Female')) ||
                                voices.find(v => v.lang === 'fr-FR') ||
                                voices.find(v => v.lang.startsWith('fr')) ||
                                voices[0];
            };
            setVoice();
            if (synth.getVoices().length === 0) {
                synth.addEventListener('voiceschanged', setVoice);
            }
            const say = (text, delaySec) => {
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'fr-FR';
                    utterance.rate = 0.92;
                    utterance.pitch = 1.12;
                    utterance.volume = 0.75;
                    if (selectedVoice) utterance.voice = selectedVoice;
                    synth.speak(utterance);
                }, delaySec * 1000);
            };
            // Paroles complètes et bienveillantes
            say("Joyeux anniversaire", 0.25);
            say("Joyeux anniversaire", 3.9);
            say("Joyeux anniversaire chère EUNICE", 7.5);
            say("Joyeux anniversaire", 11.9);
            say("Que cette journée te soit douce et lumineuse", 14.8);
            say("Plein de bonheur, EUNICE LUSIMANA", 17.6);
        }

        // --- Effets de couleurs (blanc, rouge, bleu foncé, jaune) harmonieux ---
        function addColorFlash(color) {
            const flash = document.createElement('div');
            flash.className = 'color-flash';
            flash.style.background = `radial-gradient(circle, ${color} 0%, rgba(255,250,220,0) 80%)`;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 560);
        }

        function addParticles(count, color) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'color-particle';
                const sz = Math.random() * 12 + 5;
                p.style.width = `${sz}px`;
                p.style.height = `${sz}px`;
                p.style.background = color;
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100}%`;
                p.style.boxShadow = `0 0 12px ${color}`;
                p.style.animationDuration = `${Math.random() * 0.9 + 0.5}s`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1300);
            }
        }

        function launchHarmonizedEffects() {
            const colors = ['rgba(255,245,210,0.85)', 'rgba(200,60,40,0.75)', 'rgba(10,30,80,0.75)', 'rgba(255,210,70,0.85)'];
            addColorFlash(colors[0]); addColorFlash(colors[1]); addColorFlash(colors[2]); addColorFlash(colors[3]);
            [0, 220, 440, 660].forEach((delay, idx) => setTimeout(() => addColorFlash(colors[idx % colors.length]), delay));
            addParticles(50, colors[0]);
            setTimeout(() => addParticles(50, colors[1]), 180);
            setTimeout(() => addParticles(50, colors[2]), 380);
            setTimeout(() => addParticles(50, colors[3]), 580);
        }

        // --- Rafale de ballons supplémentaire ---
        function burstBalloonsExtra(count = 38) {
            for (let i = 0; i < count; i++) setTimeout(() => createBalloon(), i * 55);
        }

        // --- Confettis spectaculaires mais élégants ---
        function launchSuperConfetti() {
            confetti({ particleCount: 250, spread: 110, origin: { y: 0.6, x: 0.5 }, startVelocity: 22, colors: ['#D4AF37', '#C0281C', '#0A1E4A', '#FFD966', '#F4A261'], decay: 0.92 });
            confetti({ particleCount: 160, angle: 60, spread: 65, origin: { x: 0.85, y: 0.5 }, startVelocity: 19, colors: ['#C0281C', '#0A1E4A', '#FFC857', '#E9C46A'] });
            confetti({ particleCount: 160, angle: 120, spread: 65, origin: { x: 0.15, y: 0.5 }, startVelocity: 19, colors: ['#D4AF37', '#C0281C', '#0A1E4A', '#FFB347'] });
            setTimeout(() => { confetti({ particleCount: 320, spread: 95, origin: { y: 0.35, x: 0.5 }, startVelocity: 14, gravity: 0.9, colors: ['#FFDFA5', '#C0281C', '#0A1E4A', '#F5B041', '#FFC857'] }); }, 140);
        }

        // --- BOUTON PRINCIPAL ---
        const mainBtn = document.getElementById('celebrateBtn');
        if (mainBtn) {
            const newButton = mainBtn.cloneNode(true);
            mainBtn.parentNode.replaceChild(newButton, mainBtn);
            const finalBtn = document.getElementById('celebrateBtn');
            
            finalBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') await ctx.resume();
                
                playFullInstrumental(ctx, 0.1);
                singCompleteBirthdaySong();
                launchSuperConfetti();
                launchHarmonizedEffects();
                burstBalloonsExtra(48);
                if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(70);
                finalBtn.style.transform = 'scale(0.96)';
                setTimeout(() => finalBtn.style.transform = '', 130);
                
                const toast = document.createElement('div');
                toast.innerText = '🎶 Joyeux Anniversaire EUNICE ! 🎶 (Chant & musique intégrale)';
                toast.style.position = 'fixed';
                toast.style.bottom = '18%';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.backgroundColor = '#fff8ef';
                toast.style.color = '#9b2c1d';
                toast.style.padding = '12px 24px';
                toast.style.borderRadius = '50px';
                toast.style.fontFamily = 'Poppins';
                toast.style.fontWeight = '600';
                toast.style.zIndex = '200';
                toast.style.boxShadow = '0 8px 20px rgba(0,0,0,0.08)';
                toast.style.border = '1px solid #d49b5f';
                toast.style.fontSize = '0.9rem';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 4500);
            });
        }

        // --- Étoiles scintillantes de fond ---
        function createStars() {
            for (let i = 0; i < 130; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1.2;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.background = `rgba(220, 180, 100, ${Math.random() * 0.5 + 0.2})`;
                document.body.appendChild(star);
            }
        }

        window.addEventListener('load', () => {
            startAmbientBalloons();
            createStars();
            setTimeout(() => {
                confetti({ particleCount: 80, spread: 55, origin: { y: 0.65, x: 0.5 }, startVelocity: 12, colors: ['#C0281C', '#0A1E4A', '#D4AF37'] });
            }, 800);
        });
    })();
</script>
</body>
</html>
